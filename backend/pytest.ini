[pytest]
asyncio_mode = auto
python_files = test_*.py *_test.py test*.py
asyncio_default_fixture_loop_scope = session
# Fixtures already default to a session-scoped loop (above); tests default to
# a per-function loop unless told otherwise. Async fixtures that open a
# connection and hand it to the test body (e.g. conftest.py's db_transaction)
# span both, so a fixture opened on the session loop got operated on from a
# different, function-scoped test loop -- asyncpg enforces loop affinity and
# raises "attached to a different loop" for exactly this mismatch. Session
# scope for both keeps every async fixture and test on the one shared loop.
asyncio_default_test_loop_scope = session
