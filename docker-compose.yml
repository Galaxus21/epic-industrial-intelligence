services:
  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Ollama runs on the host, not in Compose; host.docker.internal is the host as seen from a container.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-epic-qwen2.5}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://epic:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/epic
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - uploaded_docs:/app/uploads
    # Docker Desktop resolves host.docker.internal by itself; Linux engines need this mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # python:3.11-slim has no curl; use urllib from stdlib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - epic-net

  # ─────────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side URL: inside Docker, use the service name not localhost
      - INTERNAL_API_URL=http://backend:8000
      - NEXT_PUBLIC_APP_NAME=EPIC
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - epic-net

  # ─────────────────────────────────────────────
  # Qdrant Vector Database
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - epic-net

  # ─────────────────────────────────────────────
  # PostgreSQL (structured data)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=epic
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=epic
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epic -d epic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - epic-net

volumes:
  qdrant_data:
  postgres_data:
  uploaded_docs:

networks:
  epic-net:
    driver: bridge
