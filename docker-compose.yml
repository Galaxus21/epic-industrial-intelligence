services:
  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: opsbrain-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-opsbrain2024}
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://opsbrain:${POSTGRES_PASSWORD:-opsbrain2024}@postgres:5432/opsbrain
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploaded_docs:/app/uploads
    healthcheck:
      # python:3.11-slim has no curl; use urllib from stdlib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    networks:
      - opsbrain-net

  # ─────────────────────────────────────────────
  # Next.js Frontend
  # ─────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: opsbrain-frontend
    ports:
      - "3000:3000"
    environment:
      # Browser-side URL (user's machine sees this port)
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Server-side URL: inside Docker, use the service name not localhost
      - INTERNAL_API_URL=http://backend:8000
      - NEXT_PUBLIC_APP_NAME=AI Operations Brain
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - opsbrain-net

  # ─────────────────────────────────────────────
  # Neo4j Knowledge Graph
  # ─────────────────────────────────────────────
  neo4j:
    image: neo4j:5.19
    container_name: opsbrain-neo4j
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-opsbrain2024}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - opsbrain-net

  # ─────────────────────────────────────────────
  # Qdrant Vector Database
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: opsbrain-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - opsbrain-net

  # ─────────────────────────────────────────────
  # PostgreSQL (structured data)
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: opsbrain-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=opsbrain
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-opsbrain2024}
      - POSTGRES_DB=opsbrain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsbrain -d opsbrain"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - opsbrain-net

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  postgres_data:
  uploaded_docs:

networks:
  opsbrain-net:
    driver: bridge
