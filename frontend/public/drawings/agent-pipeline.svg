<?xml version="1.0" encoding="UTF-8"?>
<!--
  AI Operations Brain — 5-Agent Pipeline Diagram
  Source: IMPLEMENTATION_PLAN.md Phase 3 + README.md "The 5 Agents"
  Theme: Industrial Dark (#0f0f0f / #f59e0b / #10b981)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#1d1d1d"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="470" fill="#0f0f0f"/>
  <rect width="1000" height="470" fill="url(#dots)"/>

  <!-- ─── TITLE ─────────────────────────────────────────────── -->
  <text x="500" y="33" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="17" font-weight="bold"
        fill="#f9f9f9" letter-spacing="3">AGENT PIPELINE</text>
  <text x="500" y="51" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#4b5563" letter-spacing="2">MULTI-AGENT QUERY FLOW — SSE STREAMING RESPONSE</text>
  <line x1="180" y1="59" x2="820" y2="59" stroke="#2a2a2a" stroke-width="0.5"/>

  <!-- ─── OPERATOR QUERY ────────────────────────────────────── -->
  <rect x="290" y="68" width="420" height="52" rx="6"
        fill="#181818" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="90" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="11" font-weight="bold"
        fill="#f59e0b" letter-spacing="2">OPERATOR QUERY</text>
  <text x="500" y="109" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9"
        fill="#6b7280">"Pump vibration increased today. Can I continue operating?"</text>

  <!-- Fan-out arrows → 4 agents (agent centers x: 215, 405, 595, 785) -->
  <path d="M 360 120 C 330 138 265 148 215 160" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 440 120 C 430 136 415 148 405 160" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 560 120 C 570 136 585 148 595 160" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 640 120 C 670 138 735 148 785 160" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Parallel label -->
  <text x="500" y="144" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="7"
        fill="#3a3a3a" letter-spacing="1">PARALLEL EXECUTION</text>

  <!-- ─── 4 SPECIALIST AGENTS ──────────────────────────────── -->
  <!-- Equipment Brain -->
  <rect x="128" y="162" width="175" height="80" rx="6"
        fill="#181818" stroke="#a855f7" stroke-width="1.5"/>
  <text x="215" y="184" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" font-weight="bold"
        fill="#a855f7" letter-spacing="1">EQUIPMENT BRAIN</text>
  <text x="215" y="200" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">Load Neo4j graph</text>
  <text x="215" y="213" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">connections for P-101</text>
  <text x="215" y="230" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="7" fill="#3a3a3a">maintenance · incidents · docs</text>

  <!-- Maintenance Advisor -->
  <rect x="318" y="162" width="175" height="80" rx="6"
        fill="#181818" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="405" y="184" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" font-weight="bold"
        fill="#3b82f6" letter-spacing="1">MAINT. ADVISOR</text>
  <text x="405" y="200" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">Search history for</text>
  <text x="405" y="213" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">similar symptoms</text>
  <text x="405" y="230" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="7" fill="#3a3a3a">RCA · failure prob · checklist</text>

  <!-- Compliance Agent -->
  <rect x="508" y="162" width="175" height="80" rx="6"
        fill="#181818" stroke="#10b981" stroke-width="1.5"/>
  <text x="595" y="184" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" font-weight="bold"
        fill="#10b981" letter-spacing="1">COMPLIANCE AGENT</text>
  <text x="595" y="200" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">Check OISD-117,</text>
  <text x="595" y="213" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">ISO 10816, SOPs</text>
  <text x="595" y="230" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="7" fill="#3a3a3a">open issues · audit gaps</text>

  <!-- Lessons Learned -->
  <rect x="698" y="162" width="175" height="80" rx="6"
        fill="#181818" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="785" y="184" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" font-weight="bold"
        fill="#f59e0b" letter-spacing="1">LESSONS LEARNED</text>
  <text x="785" y="200" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">Correlate historical</text>
  <text x="785" y="213" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">incident patterns</text>
  <text x="785" y="230" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="7" fill="#3a3a3a">matches · warnings · timeline</text>

  <!-- Converge arrows → GPT-4.1 -->
  <path d="M 215 242 C 275 262 370 272 450 280" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 405 242 C 430 258 455 268 465 280" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 595 242 C 570 258 545 268 535 280" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <path d="M 785 242 C 725 262 630 272 550 280" fill="none" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Merge label -->
  <text x="500" y="272" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="7"
        fill="#3a3a3a" letter-spacing="1">CONTEXT AGGREGATION</text>

  <!-- ─── GPT-4.1 SYNTHESIS ──────────────────────────────── -->
  <rect x="270" y="282" width="460" height="60" rx="6"
        fill="#181818" stroke="#ec4899" stroke-width="1.5"/>
  <text x="500" y="306" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="11" font-weight="bold"
        fill="#ec4899" letter-spacing="1">SYNTHESIZER  ·  GPT-4.1</text>
  <text x="500" y="324" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#6b7280">Merges all agent contexts into one structured answer</text>
  <text x="500" y="337" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#4b5563">risk assessment  ·  actions  ·  work order  ·  cited sources</text>

  <!-- Arrow → Response -->
  <line x1="500" y1="342" x2="500" y2="363" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ─── STRUCTURED RESPONSE ───────────────────────────── -->
  <rect x="270" y="366" width="460" height="80" rx="6"
        fill="#181818" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="389" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="11" font-weight="bold"
        fill="#10b981" letter-spacing="1">STRUCTURED RESPONSE</text>

  <!-- Response items (2 columns) -->
  <text x="330" y="408" font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">▸ Risk Level: HIGH</text>
  <text x="330" y="421" font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">▸ Failure Prob: 75%</text>
  <text x="330" y="434" font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">▸ Stop within: 4 hrs</text>

  <text x="540" y="408" font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">▸ 3 Compliance Issues</text>
  <text x="540" y="421" font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">▸ Work Order: WO-2026-045</text>
  <text x="540" y="434" font-family="'Courier New',Courier,monospace" font-size="8" fill="#6b7280">▸ Sources: OEM §4.2, OISD §8.3</text>

  <!-- SSE badge (top right) -->
  <rect x="880" y="68" width="88" height="30" rx="4"
        fill="#0f2d1e" stroke="#10b981" stroke-width="1"/>
  <circle cx="893" cy="83" r="4" fill="#10b981" opacity="0.8"/>
  <text x="903" y="87" font-family="'Courier New',Courier,monospace" font-size="8" font-weight="bold" fill="#10b981">LIVE SSE</text>

  <!-- Response time badge -->
  <rect x="880" y="106" width="88" height="30" rx="4"
        fill="#1a1200" stroke="#f59e0b" stroke-width="1"/>
  <text x="924" y="121" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#f59e0b">&lt; 15 sec</text>
  <text x="924" y="131" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="7" fill="#6b7280">response time</text>
</svg>
