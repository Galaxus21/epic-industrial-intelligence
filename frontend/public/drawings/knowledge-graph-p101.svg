<?xml version="1.0" encoding="UTF-8"?>
<!--
  AI Operations Brain — P-101 Knowledge Graph Diagram
  Source: IMPLEMENTATION_PLAN.md Phase 2 — Knowledge Graph Nodes + Relationships
  Theme: Industrial Dark (#0f0f0f / #f59e0b / #10b981)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
